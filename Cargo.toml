[package]
name = "dsh-pet"
version = "1.0.0"
edition = "2021"
description = "dsh-pet 独立桌宠（Windows 原生 Win32 实现，单 exe）"

[[bin]]
name = "dsh-pet"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
] }
serde_json = "1"

[build-dependencies]
